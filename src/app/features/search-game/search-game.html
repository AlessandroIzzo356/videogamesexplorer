<section class="search-page">
  <div class="search-hero">
    <h1>Cerca giochi</h1>
    <p>Scopri titoli, generi e nuove uscite con una ricerca veloce e pulita.</p>
  </div>

  <form class="search-bar" role="search" aria-label="Cerca giochi" (submit)="onSearch($event)">
    <app-search-input
      variant="embedded"
      ariaLabel="Cerca giochi"
      placeholder="Es. Hades, Zelda, roguelike..."
      [debounceMs]="400"
      [value]="query()"
      (valueChange)="onQueryInput($event)"
      (debouncedValueChange)="onSuggestionQueryChange($event)"
    ></app-search-input>
    <button type="submit">Cerca</button>
    <span class="glow" aria-hidden="true"></span>
  </form>

  <app-game-suggestions
    [isLoading]="isSuggesting()"
    [suggestions]="suggestions()"
    [addedIds]="addedIds()"
    [useBacklogActions]="true"
    (select)="applySuggestion($event)"
    (actionError)="onBacklogActionError($event)"
  ></app-game-suggestions>

  <div class="hint-row">
    <span class="hint">Prova: coop locale</span>
    <span class="hint">RPG open world</span>
    <span class="hint">Indie 2024</span>
  </div>

  @if (isLoading()) {
    <app-loading message="Caricamento giochi..." variant="cards" [count]="8"></app-loading>
  }

  @if (error()) {
    <div class="status-row error">{{ error() }}</div>
  }

  @if (results().length) {
    <div class="results">
      @for (game of results(); track game.id ?? game.name) {
        <app-game-card
          [game]="game"
          [isAdded]="addedIds().has(game.id)"
          [backlogStatus]="statusById().get(game.id)"
          [useBacklogActions]="true"
          (actionError)="onBacklogActionError($event)"
        ></app-game-card>
      }
    </div>
  }
</section>
